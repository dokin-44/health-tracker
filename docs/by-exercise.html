<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>헬스 루틴 기록 - 종목별 조회</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>종목별 조회</h1>
  <p class="sub">종목을 고르면 기록과 최고 기록을 볼 수 있습니다.</p>

  <div class="card">
    <label for="exercise">종목</label>
    <select id="exercise"></select>
  </div>

  <div id="result">
    <div class="card best-card">
      <div class="sub">최고 기록</div>
      <div class="big" id="bestWeight">-</div>
      <div class="date" id="bestDate"></div>
    </div>

    <div class="card">
      <h2>전체 기록</h2>
      <div id="list"></div>
    </div>
  </div>

  <div class="card" id="allBestCard">
    <h2>종목별 최고 기록 한눈에 보기</h2>
    <div id="allBest"></div>
  </div>
</main>
<nav id="nav"></nav>

<script src="storage.js"></script>
<script src="nav.js"></script>
<script>
  // 종목별 조회 및 최고 기록 담당
  renderNav("exercise");

  const records = loadRecords();
  const select = document.getElementById("exercise");
  const names = [...new Set(records.map((r) => r.exercise))];

  function renderDetail() {
    const found = records.filter((r) => r.exercise === select.value);
    const best = findBest(found);
    document.getElementById("bestWeight").textContent = fmtNum(best.weight) + " kg";
    document.getElementById("bestDate").textContent = best.date;

    const box = document.getElementById("list");
    box.replaceChildren();
    const table = el("table");
    const head = el("tr");
    ["날짜", "무게", "횟수×세트"].forEach((t, i) => head.appendChild(el("th", t, i >= 1 ? "num" : "")));
    table.appendChild(head);
    // 최신 날짜가 위로 오게 정렬 (같은 날은 나중에 입력한 기록이 위)
    found.slice().reverse().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)).forEach((r) => {
      const tr = el("tr", undefined, r === best ? "best" : "");
      tr.appendChild(el("td", r.date));
      tr.appendChild(el("td", fmtNum(r.weight) + "kg", "num"));
      tr.appendChild(el("td", r.reps + "×" + r.sets, "num"));
      table.appendChild(tr);
    });
    box.appendChild(table);
  }

  function renderAllBest() {
    const box = document.getElementById("allBest");
    const table = el("table");
    const head = el("tr");
    ["종목", "최고 무게", "날짜"].forEach((t, i) => head.appendChild(el("th", t, i === 1 ? "num" : "")));
    table.appendChild(head);
    names.forEach((n) => {
      const best = findBest(records.filter((r) => r.exercise === n));
      const tr = el("tr");
      tr.appendChild(el("td", n));
      tr.appendChild(el("td", fmtNum(best.weight) + "kg", "num"));
      tr.appendChild(el("td", best.date));
      table.appendChild(tr);
    });
    box.appendChild(table);
  }

  if (!names.length) {
    document.getElementById("result").replaceChildren(el("div", "기록이 없습니다. '기록' 탭에서 먼저 운동을 입력해 주세요.", "empty"));
    select.disabled = true;
    document.getElementById("allBestCard").hidden = true;
  } else {
    names.forEach((n) => {
      const opt = el("option", n);
      opt.value = n;
      select.appendChild(opt);
    });
    select.addEventListener("change", renderDetail);
    renderDetail();
    renderAllBest();
  }
</script>
</body>
</html>
